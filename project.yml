name: BiteLedger
options:
  bundleIdPrefix: com.biteledger
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  SwiftCollections:
    url: https://github.com/apple/swift-collections.git
    from: 1.1.4
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    revision: 7fdd403089757be2ce6991b287c7bef612c8bd04
targets:
  BiteLedger:
    type: application
    platform: iOS
    sources:
      - path: BiteLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biteledger.ledger
        PRODUCT_NAME: BiteLedger
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: BiteLedger
        INFOPLIST_KEY_UIMainStoryboardFile: Main
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSCameraUsageDescription: BiteLedger reads barcodes to post entries into your food ledger.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: libsqlite3.tbd
      - package: SwiftCollections
        product: Collections
      - package: Alamofire
  BiteLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BiteLedgerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biteledger.ledger.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - target: BiteLedger
schemes:
  BiteLedger:
    build:
      targets:
        BiteLedger: all
        BiteLedgerTests: [test]
    test:
      targets:
        - BiteLedgerTests
